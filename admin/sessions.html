<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeLab - Administration des Sessions</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="../css/style.css" rel="stylesheet">
    <script src="/js/script.js" defer></script>
</head>
<body class="pro-layout">
    
    <main class="page-container" style="max-width: 1200px;">
        <header class="admin-header">
            <div>
                <h1>Gestion des Sessions</h1>
                <p class="subtitle">Pilotez vos concours de simulation et suivez l'engagement des étudiants en direct.</p>
            </div>
            <button class="btn-primary" id="open-modal-btn"><i class="fa-solid fa-plus"></i> Nouvelle session</button>
        </header>

        <!-- GRILLE DES SESSIONS -->
        <div id="sessions-container" class="admin-grid">
            <!-- Injecté dynamiquement par admin-sessions.js -->
        </div>
    </main>

    <!-- MODALE DE CRÉATION -->
    <div id="create-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Créer une session de simulation</h2>
            <form id="session-form">
                <div class="field">
                    <label>Nom de la session</label>
                    <input type="text" id="session-name" required placeholder="Ex: Master 1 Finance - TP Trading">
                </div>
                <div class="field-row">
                    <div class="field">
                        <label>Date de début</label>
                        <input type="date" id="start-date" required>
                    </div>
                    <div class="field">
                        <label>Date de fin</label>
                        <input type="date" id="end-date" required>
                    </div>
                </div>
                <div class="field">
                    <label>Capital initial par élève (€)</label>
                    <input type="number" id="initial-capital" value="100000" required>
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn-primary" style="flex: 1;">Créer et générer le code</button>
                    <button type="button" class="btn-outline" id="close-modal-btn">Annuler</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
